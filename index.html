<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahlaw Sherzad | Official Hub</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shahlaw Hub">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1c2541 0%, #0b132b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        p.bio {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .social-card:active {
            transform: scale(0.98);
        }

        .social-card i {
            font-size: 1.5rem;
            width: 35px;
        }

        .card-text {
            flex-grow: 1;
            text-align: left;
            padding-left: 10px;
        }

        .card-text .platform {
            font-weight: 600;
            font-size: 1rem;
            display: block;
        }

        .card-text .handle {
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        .youtube i { color: #ff0000; }
        .instagram i { color: #e1306c; }
        .tiktok i { color: #25f4ee; }
        .facebook i { color: #1877f2; }
        .snapchat i { color: #fffc00; }

        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .puzzle-btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
        }

        /* Puzzle Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.92);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1c2541;
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 330px;
            text-align: center;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .tile {
            aspect-ratio: 1;
            background: #3a506b;
            color: #5bc0be;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            cursor: pointer;
        }

        .tile.empty {
            background: transparent;
            cursor: default;
        }

        .close-btn {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/shahlawamedi/shahlawamedi/main/photo.jpg" alt="Shahlaw Sherzad" class="profile-img" onerror="this.src='https://github.com/shahlawamedi.png'">
    <h1>Shahlaw Sherzad</h1>
    <p class="bio">Digital Creator & Vlogger | Kurdistan 🏔️</p>

    <div class="links-wrapper">
        <a href="https://youtube.com/@shahlaw_amedi" target="_blank" class="social-card youtube">
            <i class="fa-brands fa-youtube"></i>
            <div class="card-text">
                <span class="platform">YouTube</span>
                <span class="handle">@shahlaw_amedi</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://instagram.com/shahlaw.amedi" target="_blank" class="social-card instagram">
            <i class="fa-brands fa-instagram"></i>
            <div class="card-text">
                <span class="platform">Instagram</span>
                <span class="handle">@shahlaw.amedi</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://tiktok.com/@shahlawsherzad1" target="_blank" class="social-card tiktok">
            <i class="fa-brands fa-tiktok"></i>
            <div class="card-text">
                <span class="platform">TikTok</span>
                <span class="handle">@shahlawsherzad1</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://facebook.com/Shahlaw Amedi" target="_blank" class="social-card facebook">
            <i class="fa-brands fa-facebook"></i>
            <div class="card-text">
                <span class="platform">Facebook</span>
                <span class="handle">Shahlaw Amedi</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://snapchat.com/add/shahlawsherzad" target="_blank" class="social-card snapchat">
            <i class="fa-brands fa-snapchat"></i>
            <div class="card-text">
                <span class="platform">Snapchat</span>
                <span class="handle">shahlawsherzad</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>
    </div>

    <div class="btn-group">
        <button class="action-btn" onclick="shareProfile()">
            <i class="fa-solid fa-share-nodes"></i> Share
        </button>
        <button class="action-btn puzzle-btn" onclick="openPuzzle()">
            <i class="fa-solid fa-puzzle-piece"></i> Play Game
        </button>
    </div>
</div>

<div class="modal" id="puzzleModal">
    <div class="modal-content">
        <h3>Slide Puzzle</h3>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 4px;">Arrange 1 to 8 in order!</p>
        <div class="puzzle-grid" id="grid"></div>
        <button class="close-btn" onclick="closePuzzle()">Close</button>
    </div>
</div>

<script>
    function shareProfile() {
        if (navigator.share) {
            navigator.share({
                title: 'Shahlaw Sherzad',
                text: 'Check out my official links!',
                url: window.location.href
            });
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
        }
    }

    let board = [1, 2, 3, 4, 5, 6, 7, 8, ""];
    
    function openPuzzle() {
        shuffleBoard();
        renderGrid();
        document.getElementById('puzzleModal').style.display = 'flex';
    }

    function closePuzzle() {
        document.getElementById('puzzleModal').style.display = 'none';
    }

    function shuffleBoard() {
        for (let i = board.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [board[i], board[j]] = [board[j], board[i]];
        }
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        board.forEach((val, index) => {
            const tile = document.createElement('div');
            tile.className = `tile ${val === "" ? "empty" : ""}`;
            tile.innerText = val;
            tile.onclick = () => moveTile(index);
            grid.appendChild(tile);
        });
    }

    function moveTile(index) {
        const emptyIndex = board.indexOf("");
        const validMoves = [index - 1, index + 1, index - 3, index + 3];

        if (validMoves.includes(emptyIndex)) {
            if ((index % 3 === 0 && emptyIndex === index - 1) || (index % 3 === 2 && emptyIndex === index + 1)) return;
            [board[index], board[emptyIndex]] = [board[emptyIndex], board[index]];
            renderGrid();
            checkWin();
        }
    }

    function checkWin() {
        if (board.join("") === "12345678") {
            setTimeout(() => alert("🎉 You solved the puzzle!"), 100);
        }
    }
</script>

</body>
</html>
