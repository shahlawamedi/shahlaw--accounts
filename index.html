<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahlaw Amedi | Official Links</title>
    <meta name="description" content="Official links for Shahlaw Sherzad Amedi - YouTube, Instagram, TikTok, Facebook, Snapchat.">
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shahlaw Hub">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .profile-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-glow);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        p.bio {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .social-card:active {
            transform: scale(0.98);
        }

        .social-card i {
            font-size: 1.5rem;
            width: 35px;
        }

        .card-text {
            flex-grow: 1;
            text-align: left;
            padding-left: 10px;
        }

        .card-text .platform {
            font-weight: 600;
            font-size: 1rem;
            display: block;
        }

        .card-text .handle {
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        .youtube i { color: #ff0000; }
        .instagram i { color: #e1306c; }
        .tiktok i { color: #25f4ee; }
        .facebook i { color: #1877f2; }
        .snapchat i { color: #fffc00; }

        .share-btn {
            margin-top: 28px;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
    <h1>Shahlaw Sherzad</h1>
    <p class="bio">Digital Creator & Vlogger | Kurdistan 🏔️</p>

    <div class="links-wrapper">
        <a href="https://youtube.com/@shahlaw_amedi" target="_blank" class="social-card youtube">
            <i class="fa-brands fa-youtube"></i>
            <div class="card-text">
                <span class="platform">YouTube</span>
                <span class="handle">@shahlaw_amedi</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://instagram.com/shahlaw.amedi" target="_blank" class="social-card instagram">
            <i class="fa-brands fa-instagram"></i>
            <div class="card-text">
                <span class="platform">Instagram</span>
                <span class="handle">@shahlaw.amedi</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://tiktok.com/@shahlawsherzad1" target="_blank" class="social-card tiktok">
            <i class="fa-brands fa-tiktok"></i>
            <div class="card-text">
                <span class="platform">TikTok</span>
                <span class="handle">@shahlawsherzad1</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://facebook.com/Shahlaw Amedi" target="_blank" class="social-card facebook">
            <i class="fa-brands fa-facebook"></i>
            <div class="card-text">
                <span class="platform">Facebook</span>
                <span class="handle">Shahlaw Amedi</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>

        <a href="https://snapchat.com/add/shahlawsherzad" target="_blank" class="social-card snapchat">
            <i class="fa-brands fa-snapchat"></i>
            <div class="card-text">
                <span class="platform">Snapchat</span>
                <span class="handle">shahlawsherzad</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; opacity:0.5;"></i>
        </a>
    </div>

    <button class="share-btn" onclick="shareProfile()">
        <i class="fa-solid fa-share-nodes"></i> Share Profile
    </button>
</div>

<script>
    function shareProfile() {
        if (navigator.share) {
            navigator.share({
                title: 'Shahlaw Sherzad Links',
                text: 'Check out my official social channels!',
                url: window.location.href
            });
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
        }
    }
</script>

</body>
</html>
